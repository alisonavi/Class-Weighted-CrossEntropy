</style><rect width="1180" height="700" fill="#fcfcfb"/><text x="40" y="28" class="c">EXTERNAL SOURCES, PINNED TO EXACT VERSIONS</text><rect x="40" y="40" width="300" height="62" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="52" y="60" class="t" font-size="12.5">GitHub: rmusab/vul-llm-finetune</text><text x="52" y="78" class="d">commit 862ed17, two .tar.gz archives (X1)</text><rect x="360" y="40" width="220" height="62" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="372" y="60" class="t" font-size="12.5">MITRE CWE catalog 4.20</text><text x="372" y="78" class="d">XML, reference data for CWE ids</text><rect x="640" y="40" width="300" height="62" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="652" y="60" class="t" font-size="12.5">Hugging Face: microsoft/codebert-base</text><text x="652" y="78" class="d">revision 3b0952f, 125M parameters</text><text x="40" y="150" class="c">INGEST AND QUALITY</text><text x="40" y="500" class="a">steps 1 to 4 run in data_pipeline.py</text><rect x="40" y="162" width="250" height="58" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="52" y="182" class="t" font-size="12.5">1  Acquire</text><text x="52" y="200" class="d">download, check SHA-256 against config</text><rect x="40" y="238" width="250" height="58" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="52" y="258" class="t" font-size="12.5">2  Raw zone   data/raw/</text><text x="52" y="276" class="d">files set read-only (mode 444)</text><rect x="40" y="314" width="250" height="88" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="52" y="334" class="t" font-size="12.5">3  Transform and clean</text><text x="52" y="352" class="d">rules R1 to R5, every action logged</text><text x="52" y="367" class="d">41 rows quarantined (label conflicts)</text><text x="52" y="382" class="d">56 copies removed (leakage, repeats)</text><rect x="40" y="420" width="250" height="58" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="52" y="440" class="t" font-size="12.5">4  Tokenise and profile</text><text x="52" y="458" class="d">CodeBERT tokens, class balance, lengths</text><text x="330" y="150" class="c">STORAGE</text><rect x="330" y="162" width="240" height="316" rx="7" fill="#ffffff" stroke="#52514e" stroke-width="1.1"/><text x="342" y="182" class="t" font-size="12.5">Warehouse   data/warehouse.db</text><text x="342" y="200" class="d" fill="#52514e">SQLite, file mode 600</text><text x="342" y="219" class="d" fill="#0b0b0b"></text><text x="342" y="238" class="d" fill="#0b0b0b" font-weight="700">Dataset tables</text><text x="342" y="257" class="d" fill="#0b0b0b">java_function   (24,288 rows)</text><text x="342" y="276" class="d" fill="#0b0b0b">dataset_version, label_partition</text><text x="342" y="295" class="d" fill="#0b0b0b">cwe, vcs_commit, quality_issue</text><text x="342" y="314" class="d" fill="#0b0b0b"></text><text x="342" y="333" class="d" fill="#0b0b0b" font-weight="700">View for training</text><text x="342" y="352" class="d" fill="#0b0b0b">model_input = clean rows + label</text><text x="342" y="371" class="d" fill="#0b0b0b"></text><text x="342" y="390" class="d" fill="#0b0b0b" font-weight="700">Result tables</text><text x="342" y="409" class="d" fill="#0b0b0b">experiment_run, prediction, metric</text><text x="620" y="150" class="c">MODELLING</text><rect x="620" y="162" width="270" height="74" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="632" y="182" class="t" font-size="12.5">train.py   (primary method)</text><text x="632" y="200" class="d">CodeBERT + class-weighted cross-entropy</text><text x="632" y="215" class="d">Apple MPS GPU, fixed seed, no network</text><rect x="620" y="252" width="270" height="78" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="632" y="272" class="t" font-size="12.5">Model store   checkpoints/</text><text x="632" y="290" class="d">safetensors files (no pickle)</text><text x="632" y="305" class="d">SHA-256 kept in run_summary.json</text><text x="632" y="320" class="d">not uploaded with the submission</text><rect x="620" y="346" width="270" height="58" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="632" y="366" class="t" font-size="12.5">alternative.py</text><text x="632" y="384" class="d">frozen CodeBERT + weighted log. regression,</text><text x="632" y="399" class="d">writes predictions like train.py</text><rect x="620" y="420" width="270" height="58" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="632" y="440" class="t" font-size="12.5">baselines.py</text><text x="632" y="458" class="d">majority class, code length, TF-IDF,</text><text x="632" y="473" class="d">same outputs, used as reference</text><text x="940" y="150" class="c">EVALUATION AND USE</text><rect x="940" y="162" width="210" height="74" rx="7" fill="#fde9df" stroke="#eb6834" stroke-width="1.1"/><text x="952" y="182" class="t" font-size="12.5">evaluate.py</text><text x="952" y="200" class="d">threshold from validation,</text><text x="952" y="215" class="d">test metrics, 95% CI, charts</text><rect x="940" y="252" width="210" height="58" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="952" y="272" class="t" font-size="12.5">Report, slides, notebook</text><text x="952" y="290" class="d">metrics.json feeds the text</text><rect x="940" y="326" width="210" height="74" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="952" y="346" class="t" font-size="12.5">demo.py</text><text x="952" y="364" class="d">checks the model hash,</text><text x="952" y="379" class="d">scores one Java function</text><rect x="940" y="416" width="210" height="62" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="952" y="436" class="t" font-size="12.5">Security reviewer</text><text x="952" y="454" class="d">reads top-scored code first</text><path d="M190,102 L190,158" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M470,102 L470,128 L230,128 L230,158" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M165,220 L165,234" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M165,296 L165,310" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M165,402 L165,416" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M290,449 L326,449" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="300" y="441" class="a" text-anchor="start">load</text><path d="M570,199 L616,199" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="577" y="191" class="a" text-anchor="start">read</text><path d="M790,102 L790,158" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="798" y="136" class="a" text-anchor="start">base weights for train.py and alternative.py</text><path d="M570,375 L616,375" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M570,449 L616,449" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M755,236 L755,248" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M755,346 L755,334" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M890,199 L936,199" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="895" y="191" class="a" text-anchor="start">scores</text><path d="M890,291 L915,291 L915,363 L936,363" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="897" y="283" class="a" text-anchor="start">loads</text><path d="M1045,236 L1045,248" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M1045,400 L1045,412" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><path d="M1150,220 L1166,220 L1166,500 L450,500 L450,482" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><text x="700" y="494" class="a" text-anchor="middle">results written back: experiment_run, prediction, metric</text><text x="40" y="548" class="c">GOVERNANCE AND SECURITY CONTROLS (across all steps)</text><rect x="40" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="52" y="580" class="t" font-size="12">Pinned versions</text><text x="52" y="598" class="d">config.json fixes data commit,</text><text x="52" y="613" class="d">model revision and seed</text><rect x="227" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="239" y="580" class="t" font-size="12">Integrity</text><text x="239" y="598" class="d">SHA-256 on archives,</text><text x="239" y="613" class="d">catalog and checkpoints</text><rect x="414" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="426" y="580" class="t" font-size="12">Least privilege</text><text x="426" y="598" class="d">raw files read-only, warehouse</text><text x="426" y="613" class="d">600, training reads read-only</text><rect x="601" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="613" y="580" class="t" font-size="12">Lineage and audit</text><text x="613" y="598" class="d">source file and line per row,</text><text x="613" y="613" class="d">quality_issue log, quarantine</text><rect x="788" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="800" y="580" class="t" font-size="12">Offline training</text><text x="800" y="598" class="d">no Hub calls while training;</text><text x="800" y="613" class="d">auto-conversion switched off</text><rect x="975" y="560" width="177" height="76" rx="7" fill="#efeee9" stroke="#a9a8a0" stroke-width="1.1"/><text x="987" y="580" class="t" font-size="12">Roles (RACI)</text><text x="987" y="598" class="d">data owner, steward, ML</text><text x="987" y="613" class="d">engineer, security reviewer</text></svg>