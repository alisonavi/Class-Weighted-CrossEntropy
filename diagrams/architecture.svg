<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.t { font-weight: 700; fill: #0b0b0b; }
