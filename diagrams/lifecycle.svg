</style><rect width="1180" height="374" fill="#fcfcfb"/><text x="20" y="28" class="c">DATA LIFECYCLE IN THIS PROJECT (Lecture 1 stages, as the midterm task names them)</text><rect x="20" y="46" width="150" height="122" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="31" y="68" class="n">1</text><text x="46" y="68" class="t">Acquisition</text><text x="31" y="92" class="d">pinned GitHub commit,</text><text x="31" y="108" class="d">2 archives + MITRE</text><text x="31" y="124" class="d">CWE 4.20 catalog,</text><text x="31" y="140" class="d">SHA-256 checked</text><path d="M171,107.0 L183,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="185" y="46" width="150" height="122" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="196" y="68" class="n">2</text><text x="211" y="68" class="t">Validation</text><text x="196" y="92" class="d">rules R1 to R5:</text><text x="196" y="108" class="d">label must match P1-P3,</text><text x="196" y="124" class="d">code must parse as Java;</text><text x="196" y="140" class="d">41 rows quarantined</text><path d="M336,107.0 L348,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="350" y="46" width="150" height="122" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="361" y="68" class="n">3</text><text x="376" y="68" class="t">Storage</text><text x="361" y="92" class="d">raw zone read-only;</text><text x="361" y="108" class="d">SQLite warehouse,</text><text x="361" y="124" class="d">9 tables + 1 view,</text><text x="361" y="140" class="d">file mode 600</text><path d="M501,107.0 L513,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="515" y="46" width="150" height="122" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="526" y="68" class="n">4</text><text x="541" y="68" class="t">Transformation</text><text x="526" y="92" class="d">CRLF to LF, 56 copies</text><text x="526" y="108" class="d">removed; CodeBERT</text><text x="526" y="124" class="d">tokens, cut at 512;</text><text x="526" y="140" class="d">view model_input</text><path d="M666,107.0 L678,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="680" y="46" width="150" height="122" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="691" y="68" class="n">5</text><text x="706" y="68" class="t">Training</text><text x="691" y="92" class="d">CodeBERT, 125M params,</text><text x="691" y="108" class="d">class-weighted CE,</text><text x="691" y="124" class="d">4 epochs, keep the</text><text x="691" y="140" class="d">best on validation</text><path d="M831,107.0 L843,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="845" y="46" width="150" height="122" rx="7" fill="#e3edfb" stroke="#2a78d6" stroke-width="1.1"/><text x="856" y="68" class="n">6</text><text x="871" y="68" class="t">Evaluation</text><text x="856" y="92" class="d">test split only, threshold</text><text x="856" y="108" class="d">from validation, 95%</text><text x="856" y="124" class="d">bootstrap intervals,</text><text x="856" y="140" class="d">results back into DB</text><path d="M996,107.0 L1008,107.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#head)"/><rect x="1010" y="46" width="150" height="122" rx="7" fill="#ffffff" stroke="#a9a8a0" stroke-width="1.1"/><text x="1021" y="68" class="n">7</text><text x="1036" y="68" class="t">Retention / deletion</text><text x="1021" y="92" class="d">keep: config, logs,</text><text x="1021" y="108" class="d">metrics, hashes;</text><text x="1021" y="124" class="d">delete checkpoints</text><text x="1021" y="140" class="d">after grading</text><path d="M920.0,168 V202 H260.0 V172" fill="none" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#headblue)"/><text x="590.0" y="195" class="a" text-anchor="middle">what evaluation finds becomes a new quality rule (example: the leakage check R5)</text><text x="20" y="248" class="c">INFORMATION VALUE CHAIN (Lecture 1), WITH OUR EXAMPLE AT EACH STEP</text><polygon points="20,262 164,262 178,285.0 164,308 20,308 20,285.0" fill="#f4f3ef" stroke="#ffffff" stroke-width="1.5"/><text x="95.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Raw data</text><text x="26" y="330" class="d">24,288 JSONL rows,</text><text x="26" y="346" class="d">two dataset versions</text><polygon points="182,262 326,262 340,285.0 326,308 182,308 196,285.0" fill="#ecebe5" stroke="#ffffff" stroke-width="1.5"/><text x="264.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Processed data</text><text x="188" y="330" class="d">22,877 clean functions</text><text x="188" y="346" class="d">in X1 with P3</text><polygon points="344,262 488,262 502,285.0 488,308 344,308 358,285.0" fill="#dfe9f8" stroke="#ffffff" stroke-width="1.5"/><text x="426.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Information</text><text x="350" y="330" class="d">1 vulnerable in 35;</text><text x="350" y="346" class="d">P3 code is short</text><polygon points="506,262 650,262 664,285.0 650,308 506,308 520,285.0" fill="#cfe0f6" stroke="#ffffff" stroke-width="1.5"/><text x="588.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Knowledge</text><text x="512" y="330" class="d">trained model, scores,</text><text x="512" y="346" class="d">test metrics with CI</text><polygon points="668,262 812,262 826,285.0 812,308 668,308 682,285.0" fill="#bcd5f3" stroke="#ffffff" stroke-width="1.5"/><text x="750.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Insights</text><text x="674" y="330" class="d">it spots code a fix touched,</text><text x="674" y="346" class="d">not the bug itself</text><polygon points="830,262 974,262 988,285.0 974,308 830,308 844,285.0" fill="#a7c8f0" stroke="#ffffff" stroke-width="1.5"/><text x="912.0" y="290.0" class="t" text-anchor="middle" fill="#0b0b0b" style="fill:#0b0b0b">Decisions</text><text x="836" y="330" class="d">review top-scored code</text><text x="836" y="346" class="d">first; never a gate</text><polygon points="992,262 1136,262 1150,285.0 1136,308 992,308 1006,285.0" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/><text x="1074.0" y="290.0" class="t" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">Value</text><text x="998" y="330" class="d">fewer review hours per</text><text x="998" y="346" class="d">real vulnerability found</text></svg>